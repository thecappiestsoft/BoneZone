<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Bone Zone: Misja Szkielet – dynamiczna gra edukacyjna o układzie kostnym człowieka." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cg transform='rotate(-40 50 50)' fill='%23f5ecd7' stroke='%237c5a2a' stroke-width='4'%3E%3Ccircle cx='18' cy='40' r='13'/%3E%3Ccircle cx='18' cy='60' r='13'/%3E%3Ccircle cx='82' cy='40' r='13'/%3E%3Ccircle cx='82' cy='60' r='13'/%3E%3Crect x='16' y='41' width='68' height='18' stroke='none'/%3E%3C/g%3E%3C/svg%3E" />
    <meta name="theme-color" content="#0d1530" />
    <title>Bone Zone</title>
    <script>
      try {
        var s = JSON.parse(localStorage.getItem('bonezone.settings.v1') || '{}');
        var th = s.theme || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        document.documentElement.dataset.theme = th;
      } catch (e) { /* brak dostępu do localStorage */ }
    </script>
    <script type="module" crossorigin src="./assets/bone-zone.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/bone-zone.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
