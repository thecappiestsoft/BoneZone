"Kość długa – wydłużony trzon i dwie nasady (np. kość udowa)":"Long bone – elongated shaft and two ends (e.g. femur)","Kości długie (np. udowa, ramienna) mają trzon i dwie nasady – działają jak dźwignie.":"Long bones (e.g. femur, humerus) have a shaft and two epiphyses – they act as levers.","Kość krótka – mała, zbliżona do sześcianu (np. kości nadgarstka)":"Short bone – small, roughly cube-shaped (e.g. carpal bones)","Kości krótkie (nadgarstka, stępu) są wytrzymałe i umożliwiają drobne ruchy.":"Short bones (carpals, tarsals) are strong and allow small movements.","Kość płaska – cienka płytka (np. łopatka, kości sklepienia czaszki)":"Flat bone – a thin plate (e.g. scapula, bones of the skull vault)","Kości płaskie chronią narządy (czaszka – mózg) i dają duże przyczepy mięśniom.":"Flat bones protect organs (skull – brain) and give large attachment areas for muscles.","Kość różnokształtna – np. kręg z trzonem i wyrostkami":"Irregular bone – e.g. a vertebra with a body and processes","Kręgi to kości różnokształtne: mają trzon, łuk i wyrostki.":"Vertebrae are irregular bones: they have a body, an arch and processes.","Trzeszczka – kość leżąca w ścięgnie, np. rzepka":"Sesamoid bone – a bone embedded in a tendon, e.g. the patella","Rzepka to największa trzeszczka – leży w ścięgnie mięśnia czworogłowego uda.":"The patella is the largest sesamoid bone – it lies in the tendon of the quadriceps.","Komórka kościotwórcza – wytwarza substancję międzykomórkową kości":"Bone-forming cell – produces the bone matrix","Osteoblasty budują kość, a gdy otoczą się substancją międzykomórkową, stają się osteocytami.":"Osteoblasts build bone; once surrounded by the matrix they produce, they become osteocytes.","Dojrzała komórka kostna w jamce, z licznymi wypustkami":"Mature bone cell in a lacuna, with many processes","Osteocyty leżą w jamkach kostnych i łączą się wypustkami w kanalikach.":"Osteocytes sit in lacunae and connect through processes in canaliculi.","Duża, wielojądrowa komórka rozkładająca (resorbująca) kość":"Large, multinucleated cell that breaks down (resorbs) bone","Osteoklasty usuwają starą tkankę kostną – to warunek przebudowy kości.":"Osteoclasts remove old bone tissue – a condition for bone remodelling.","Komórka tkanki chrzęstnej leżąca w jamce (często po dwie)":"Cartilage cell sitting in a lacuna (often in pairs)","Chondrocyty leżą w jamkach, często w grupach izogenicznych; chrząstka nie ma naczyń krwionośnych.":"Chondrocytes sit in lacunae, often in isogenous groups; cartilage has no blood vessels.","Od NAJDŁUŻSZEJ kości do najkrótszej":"From the LONGEST bone to the shortest","Kość udowa jest najdłuższą kością człowieka; paliczki to najmniejsze kości długie.":"The femur is the longest human bone; phalanges are the smallest long bones.","Kość śródręcza":"Metacarpal bone","Paliczek palca":"Finger phalanx","Odcinki kręgosłupa – od NAJWIĘKSZEJ liczby kręgów do najmniejszej":"Spine sections – from the MOST vertebrae to the fewest","Kręgów piersiowych jest 12, szyjnych 7, lędźwiowych 5.":"There are 12 thoracic, 7 cervical and 5 lumbar vertebrae.","Piersiowy (12)":"Thoracic (12)","Szyjny (7)":"Cervical (7)","Lędźwiowy (5)":"Lumbar (5)","Odcinki kręgosłupa – od góry do dołu":"Spine sections – from top to bottom","Kręgosłup: 7 kręgów szyjnych, 12 piersiowych, 5 lędźwiowych, kość krzyżowa i kość ogonowa.":"Spine: 7 cervical, 12 thoracic and 5 lumbar vertebrae, the sacrum and the coccyx.",Szyjny:"Cervical",Piersiowy:"Thoracic",Lędźwiowy:"Lumbar",Krzyżowy:"Sacral",Ogonowy:"Coccygeal","Budowa kości długiej – od ZEWNĄTRZ do środka trzonu":"Long bone structure – from the OUTSIDE to the centre of the shaft","Trzon pokrywa okostna, pod nią leży istota zbita, a w środku – jama szpikowa ze szpikiem.":"The shaft is covered by periosteum, below it lies compact bone and in the centre – the medullary cavity with marrow.","Gojenie złamania – po kolei":"Fracture healing – in order","Krwiak → kostnina chrzęstno-włóknista (miękka) → kostnina kostna (twarda) → przebudowa przez osteoklasty i osteoblasty.":"Haematoma → fibrocartilaginous (soft) callus → bony (hard) callus → remodelling by osteoclasts and osteoblasts.",Krwiak:"Haematoma","Kostnina miękka":"Soft callus","Kostnina twarda":"Hard callus","Przebudowa kości":"Bone remodelling","Losy komórki kostnej – po kolei":"Life of a bone cell – in order","Osteoblast, który otoczy się wytworzoną przez siebie substancją międzykomórkową, staje się osteocytem.":"An osteoblast surrounded by the matrix it has produced becomes an osteocyte.","Komórka macierzysta (osteoprogenitorowa)":"Stem cell (osteoprogenitor)",Osteoblast:"Osteoblast",Osteocyt:"Osteocyte","Kostnienie na podłożu chrzęstnym – po kolei":"Endochondral ossification – in order","Chrzęstny model kości zastępowany jest tkanką kostną; wzrost na długość kończy się, gdy chrząstka nasadowa skostnieje.":"The cartilage model is replaced by bone; growth in length stops when the growth plate ossifies.","Model z chrząstki szklistej":"Hyaline cartilage model","Punkt kostnienia w trzonie":"Ossification centre in the shaft","Punkty kostnienia w nasadach":"Ossification centres in the epiphyses","Zarośnięcie chrząstki nasadowej":"Closure of the growth plate","Kości kończyny górnej – od NAJWYŻEJ położonej":"Upper limb bones – from the HIGHEST one","Obręcz barkowa (obojczyk, łopatka) łączy kończynę górną z tułowiem; dalej: ramię, przedramię, ręka.":"The shoulder girdle (clavicle, scapula) joins the upper limb to the trunk; then: arm, forearm, hand.","Pierwsza pomoc przy złamaniu kości przedramienia: przeciągnij do poszkodowanego TYLKO właściwe działania.":"First aid for a broken forearm: drag ONLY the correct actions to the casualty.","Złamanie: wezwij pomoc, unieruchom kończynę (dwa sąsiednie stawy), nie nastawiaj kości. Zimny okład zmniejsza obrzęk i ból.":"Fracture: call for help, immobilise the limb (two neighbouring joints), do not try to set the bone. A cold compress reduces swelling and pain.",POSZKODOWANY:"CASUALTY","Wezwij pomoc (112)":"Call for help (112 / 999)","Unieruchom dwa sąsiednie stawy":"Immobilise two neighbouring joints","Przyłóż zimny okład przez materiał":"Apply a cold compress through cloth","Nastaw kość na miejsce":"Push the bone back into place","Nigdy nie nastawiamy kości – można uszkodzić naczynia i nerwy. Robi to lekarz.":"Never set a bone yourself – you may damage vessels and nerves. A doctor does it.","Każ poruszać ręką":"Ask them to move the arm","Ruch przemieszcza odłamy kości – kończynę trzeba unieruchomić.":"Movement shifts the bone fragments – the limb must be immobilised.","Masuj bolące miejsce":"Massage the painful spot","Masowanie złamania jest szkodliwe – może przemieścić odłamy.":"Massaging a fracture is harmful – it can displace the fragments.","Zrośnij złamanie: przeciągaj etapy gojenia kości do szczeliny złamania – po kolei!":"Heal the fracture: drag the stages of bone healing into the fracture gap – in order!","Gojenie złamania: krwiak → kostnina miękka (chrzęstno-włóknista) → kostnina twarda (kostna) → przebudowa i odtworzenie kształtu kości.":"Fracture healing: haematoma → soft (fibrocartilaginous) callus → hard (bony) callus → remodelling and restoring the bone shape.",ZŁAMANIE:"FRACTURE","Krwiak w szczelinie złamania":"Haematoma in the fracture gap","Kostnina miękka (chrzęstno-włóknista)":"Soft callus (fibrocartilaginous)","Kostnina twarda (kostna)":"Hard callus (bony)","Zanik okostnej":"Loss of the periosteum","Okostna jest potrzebna do gojenia – zawiera komórki kościotwórcze.":"The periosteum is needed for healing – it contains bone-forming cells.","Zamiana kości w chrząstkę stawową":"Bone turning into articular cartilage","Chrząstka stawowa pokrywa powierzchnie stawowe – nie jest etapem gojenia złamania.":"Articular cartilage covers joint surfaces – it is not a stage of fracture healing.","Leczenie i gojenie złamania – ułóż etapy po kolei.":"Fracture treatment and healing – put the stages in order.","Lekarz nastawia (repozycja) i unieruchamia odłamy. Gojenie: krwiak → kostnina miękka → kostnina twarda → przebudowa (osteoklasty usuwają nadmiar, osteoblasty budują).":"A doctor realigns (reduces) and immobilises the fragments. Healing: haematoma → soft callus → hard callus → remodelling (osteoclasts remove excess, osteoblasts build).","Repozycja i unieruchomienie odłamów (lekarz)":"Reduction and immobilisation of fragments (doctor)","Krwiak i odczyn zapalny":"Haematoma and inflammation","Przebudowa (osteoklasty + osteoblasty)":"Remodelling (osteoclasts + osteoblasts)","Masaż miejsca złamania w 1. dobie":"Massaging the fracture on day 1","Świeże złamanie wymaga unieruchomienia – masaż może przemieścić odłamy.":"A fresh fracture needs immobilisation – massage can displace the fragments.","Resorpcja chrząstki stawowej":"Resorption of articular cartilage","To nie jest etap gojenia złamania.":"This is not a stage of fracture healing.","Plecak na jednym ramieniu":"Backpack on one shoulder","Garbienie się przy biurku":"Slouching at the desk","Głowa pochylona nad telefonem":"Head bent over the phone","Cały dzień bez ruchu":"A whole day without moving","Dźwiganie na prostych nogach":"Lifting with straight legs","Za ciężki tornister":"An overloaded school bag","Plecak na obu ramionach":"Backpack on both shoulders",Pływanie:"Swimming","Spacer na słońcu (witamina D)":"A walk in the sun (vitamin D)","Proste plecy przy biurku":"Straight back at the desk","Nabiał – źródło wapnia":"Dairy – a source of calcium","Podnoszenie z ugiętymi kolanami":"Lifting with bent knees","Przerwa na rozciąganie":"A stretching break","kość udowa":"femur","kość ramienna":"humerus",obojczyk:"clavicle",żebro:"rib","kości przedramienia":"forearm bones","kości podudzia":"lower leg bones","kość promieniowa":"radius","kość łokciowa":"ulna","kość piszczelowa":"tibia","kość strzałkowa":"fibula","kość łódeczkowata":"scaphoid","kość piętowa":"calcaneus (heel bone)","Szkoła podstawowa":"Primary school","Klasy 7–8":"Years 7–8 (ages 13–15)","Funkcje i budowa rt bones","Kości płaskie":"Flat bones","Kości różnokształtne":"Irregular bones","Szkielet osiowy czy kończyn?":"Axial or appendicular?","Szkielet osiowy":"Axial skeleton","Szkielet kończyn":"Appendicular skeleton","Sole mineralne czy osseina?":"Minerals or ossein?","Sole mineralne":"Mineral salts","Osseina (związki organiczne)":"Ossein (organic matter)","Połączenia ścisłe":"Fixed joints","Stawy (połączenia ruchome)":"Synovial (movable) joints","Komórki kostne":"Bone cells",Osteoblasty:"Osteoblasts",Osteocyty:"Osteocytes",Osteoklasty:"Osteoclasts","Części kości długiej i ich funkcje":"Parts of a long bone and their functions","Kości i ich położenie":"Bones and their location","Elementy stawu":"Parts of a joint","Rodzaje stawów – przykłady":"Types of joints – examples","Komórki tkanki kostnej i chrzęstnej":"Bone and cartilage cells","Urazy, choroby i wady":"Injuries, diseases and defects","Badania obrazowe kości":"Bone imaging tests","kość długa":"long bone","kość krótka":"short bone","kość płaska":"flat bone","kość różnokształtna (kręg)":"irregular bone (vertebra)","trzeszczka (rzepka)":"sesamoid bone (patella)",osteoblast:"osteoblast",osteocyt:"osteocyte",osteoklast:"osteoclast",chondrocyt:"chondrocyte","krwinka czerwona":"red blood cell",bakteria:"bacterium",neuron:"neuron","włókno mięśniowe":"muscle fibre","jon wapnia (Ca²⁺)":"calcium ion (Ca²⁺)","fosforan (PO₄³⁻)":"phosphate (PO₄³⁻)","witamina D":"vitamin D","kwas (H⁺)":"acid (H⁺)","tlen (O₂)":"oxygen (O₂)",glukoza:"glucose","mikrouszkodzenie kości":"bone micro-damage","kropla krwi":"blood drop"},jk={"Kości są dźwigniami poruszanymi przez kurczące się mięśnie.":"Bones are levers moved by contracting muscles.","Szkielet jest biernym narządem ruchu, a mięśnie – czynnym.":"The skeleton is the passive part of the locomotor system, and muscles are the active part.","Ochrona narządów wewnętrznych to jedna z głównych funkcji szkieletu.":"Protecting internal organs is one of the main functions of the skeleton.","Czaszka chroni mózg, a klatka piersiowa – serce i płuca.":"The skull protects the brain, and the rib cage protects the heart and lungs.","Krwinki powstają w szpiku czerwonym, który znajduje się w kościach.":"Blood cells are made in red bone marrow, which is found inside bones.","W kościach powstają krwinki.":"Blood cells are produced inside bones.","Gdy we krwi brakuje wapnia, może on być uwalniany z kości.":"When blood calcium is low, calcium can be released from bones.","Kości są magazynem soli mineralnych, m.in. wapnia i fosforu.":"Bones store mineral salts, including calcium and phosphorus.","Noworodek ma ich więcej – część kości zrasta się z wiekiem.":"A newborn has more – some bones fuse with age.","Dorosły człowiek ma około 206 kości.":"An adult human has about 206 bones.","Noworodek ma więcej kości (ok. 270–300) – wiele z nich zrasta się w trakcie rozwoju.":"A newborn has more bones (about 270–300) – many of them fuse during development.","Noworodek ma mniej kości niż dorosły człowiek.":"A newborn has fewer bones than an adult.","Kość udowa jest najdłuższą i jedną z najmocniejszych kości.":"The femur is the longest and one of the strongest bones.","Najdłuższą kością człowieka jest kość udowa.":"The longest bone in the human body is the femur.","Powierzchnie stawowe pokrywa chrząstka stawowa; okostna pokrywa resztę kości.":"Joint surfaces are covered by articular cartilage; the periosteum covers the rest of the bone.","Okostna pokrywa powierzchnie stawowe kości.":"The periosteum covers the joint surfaces of bones.","Okostna zawiera nerwy i naczynia; odżywia kość i uczestniczy w jej gojeniu.":"The periosteum contains nerves and vessels; it nourishes the bone and takes part in healing.","Okostna jest unerwiona i ukrwiona, dlatego uraz kości boli.":"The periosteum has nerves and blood vessels, which is why a bone injury hurts.","Szpik żółty to głównie tkanka tłuszczowa; szpik czerwony u dorosłych jest w istocie gąbczastej.":"Yellow marrow is mainly fat tissue; in adults red marrow is found in spongy bone.","U dorosłego jama szpikowa trzonu kości długiej wypełniona jest szpikiem żółtym.":"In adults the medullary cavity of a long bone shaft is filled with yellow marrow.","Między beleczkami istoty gąbczastej znajduje się szpik czerwony.":"Red marrow lies between the trabeculae of spongy bone.","Istota gąbczasta budowana jest z beleczek kostnych.":"Spongy bone is made of bony trabeculae.","Ściany trzonu buduje istota zbita; istota gąbczasta wypełnia głównie nasady.":"The shaft walls are made of compact bone; spongy bone mainly fills the epiphyses.","Trzon kości długiej zbudowany jest głównie z istoty gąbczastej.":"The shaft of a long bone is made mainly of spongy bone.","Kości krótkie są małe i mają kształt zbliżony do sześcianu.":"Short bones are small and roughly cube-shaped.","Kości nadgarstka i stępu to kości krótkie.":"Carpal and tarsal bones are short bones.","Łopatka jest kością płaską.":"The scapula is a flat bone.","Łopatka jest kością długą.":"The scapula is a long bone.","Kręg ma trzon, łuk i wyrostki – to kość o nieregularnym kształcie.":"A vertebra has a body, an arch and processes – it is an irregularly shaped bone.","Kręgi to kości różnokształtne.":"Vertebrae are irregular bones.","Głównie fosforan wapnia nadaje kości twardość i wytrzymałość.":"Mainly calcium phosphate gives bone its hardness and strength.","Sole mineralne nadają kościom twardość.":"Mineral salts make bones hard.","Osseina (białko kolagen) to organiczny składnik kości – odpowiada za elastyczność.":"Ossein (the protein collagen) is the organic component of bone – it provides flexibility.","Osseina nadaje kościom sprężystość.":"Ossein makes bones flexible.","Wyprażanie usuwa związki organiczne – zostają sole mineralne, kość jest krucha.":"Heating removes organic matter – the mineral salts remain and the bone becomes brittle.","Kość po wyprażeniu w płomieniu staje się elastyczna.":"A bone heated in a flame becomes flexible.","Kwas rozpuszcza sole mineralne – zostaje elastyczna osseina.":"Acid dissolves the mineral salts – flexible ossein remains.","Kość moczona w occie lub kwasie solnym staje się giętka.":"A bone soaked in vinegar or hydrochloric acid becomes bendy.","U dzieci jest więcej osseiny – kości są bardziej sprężyste.":"Children have more ossein – their bones are more flexible.","Kości osób starszych zawierają względnie więcej soli mineralnych niż kości dzieci, dlatego łatwiej się łamią.":"Older people's bones contain relatively more mineral salts than children's bones, so they break more easily.","Żuchwa łączy się z kością skroniową stawem skroniowo-żuchwowym.":"The mandible joins the temporal bone at the temporomandibular joint.","Żuchwa jest jedyną ruchomą kością czaszki.":"The mandible is the only movable bone of the skull.","Szwy to połączenia ścisłe (więzozrosty).":"Sutures are fixed (fibrous) joints.","Kości sklepienia czaszki połączone są szwami.":"The bones of the skull vault are joined by sutures.","Mózgoczaszka chroni mózg, twarzoczaszka tworzy szkielet twarzy.":"The cranium protects the brain; the facial skeleton forms the face.","Czaszkę dzielimy na mózgoczaszkę i twarzoczaszkę.":"The skull is divided into the cranium and the facial skeleton.","Szyjnych – 7, piersiowych – 12, lędźwiowych – 5.":"Cervical – 7, thoracic – 12, lumbar – 5.","Kręgosłup człowieka ma 7 kręgów szyjnych.":"The human spine has 7 cervical vertebrae.","Ma krzywizny: lordozy (szyjną, lędźwiową) i kifozy (piersiową, krzyżową) – amortyzują wstrząsy.":"It has curves: lordoses (cervical, lumbar) and kyphoses (thoracic, sacral) – they absorb shocks.","Kręgosłup dorosłego człowieka jest prosty jak kij.":"An adult's spine is as straight as a stick.","Esowaty kształt kręgosłupa działa jak sprężyna.":"The S-shape of the spine works like a spring.","Krzywizny kręgosłupa amortyzują wstrząsy podczas chodzenia i biegania.":"The curves of the spine absorb shocks when walking and running.","Krążki amortyzują wstrząsy i umożliwiają niewielkie ruchy.":"The discs absorb shocks and allow small movements.","Między trzonami kręgów leżą krążki międzykręgowe zbudowane z chrząstki włóknistej.":"Intervertebral discs made of fibrocartilage lie between the vertebral bodies.","Kość krzyżowa to 5 zrośniętych kręgów krzyżowych (kościozrost).":"The sacrum is 5 fused sacral vertebrae (bony fusion).","Kość krzyżowa powstała ze zrośnięcia kręgów.":"The sacrum formed from fused vertebrae.","12 par żeber łączy się z 12 kręgami piersiowymi.":"12 pairs of ribs join the 12 thoracic vertebrae.","Klatkę piersiową tworzą: mostek, żebra i odcinek piersiowy kręgosłupa.":"The rib cage is made of the sternum, the ribs and the thoracic spine.","Żebra prawdziwe (7 par), rzekome (3 pary) i wolne (2 pary).":"True ribs (7 pairs), false ribs (3 pairs) and floating ribs (2 pairs).","Człowiek ma 12 par żeber.":"Humans have 12 pairs of ribs.","Żebra wolne (11. i 12. para) kończą się swobodnie – nie dochodzą do mostka.":"Floating ribs (11th and 12th pairs) end freely – they do not reach the sternum.","Żebra wolne łączą się bezpośrednio z mostkiem.":"Floating ribs attach directly to the sternum.","Obręcz barkowa łączy kończyny górne z tułowiem.":"The shoulder girdle joins the upper limbs to the trunk.","Obręcz barkową tworzą obojczyki i łopatki.":"The shoulder girdle is made of the clavicles and scapulae.","Kość promieniowa leży po stronie kciuka.":"The radius is on the thumb side.","W przedramieniu znajdują się kość promieniowa i kość łokciowa.":"The forearm contains the radius and the ulna.","Kość ramienna to kość ramienia (między barkiem a łokciem).":"The humerus is the bone of the upper arm (between the shoulder and the elbow).","Kość ramienna leży w przedramieniu.":"The humerus is in the forearm.","W pozycji anatomicznej kość promieniowa jest boczna, łokciowa – przyśrodkowa.":"In the anatomical position the radius is lateral and the ulna medial.","Piszczelowa jest grubsza i dźwiga większość ciężaru ciała.":"The tibia is thicker and carries most of the body weight.","W podudziu znajdują się kość piszczelowa i kość strzałkowa.":"The lower leg contains the tibia and the fibula.","Rzepka chroni staw kolanowy i usprawnia pracę mięśnia czworogłowego.":"The patella protects the knee and helps the quadriceps work.","Rzepka leży z przodu stawu kolanowego.":"The patella lies at the front of the knee joint.","Obniżenie łuków to płaskostopie.":"Lowered arches are called flat feet.","Łuki stopy pomagają amortyzować wstrząsy.":"The arches of the foot help absorb shocks.","Zrastają się w okolicy panewki stawu biodrowego.":"They fuse around the socket of the hip joint.","Kość miedniczna powstaje ze zrośnięcia kości biodrowej, kulszowej i łonowej.":"The hip bone forms from the fused ilium, ischium and pubis.","Połączenia ścisłe (np. szwy) nie pozwalają na ruch lub tylko na bardzo niewielki.":"Fixed joints (e.g. sutures) allow no movement or only very little.","Stawy to połączenia ruchome kości.":"Synovial joints are movable connections between bones.","Kości łonowe łączy chrząstka włóknista.":"The pubic bones are joined by fibrocartilage.","Spojenie łonowe to przykład chrząstkozrostu.":"The pubic symphysis is an example of a cartilaginous joint.","Gładka chrząstka zmniejsza tarcie.":"Smooth cartilage reduces friction.","Powierzchnie stawowe pokrywa chrząstka stawowa.":"Joint surfaces are covered by articular cartilage.","Maź stawowa zmniejsza tarcie i odżywia chrząstkę stawową.":"Synovial fluid reduces friction and nourishes the articular cartilage.","Maź stawowa zwiększa tarcie w stawie.":"Synovial fluid increases friction in the joint.","Stawy kuliste umożliwiają ruch w wielu płaszczyznach.":"Ball-and-socket joints allow movement in many planes.","Staw biodrowy i staw ramienny to stawy kuliste.":"The hip and shoulder joints are ball-and-socket joints.","Płytka panewka stawu ramiennego zwiększa ruchomość, ale zmniejsza stabilność.":"The shallow socket of the shoulder joint increases mobility but reduces stability. carpals, tarsals) are small and strong. Flat bones (scapula, sternum, skull vault bones) protect organs. Irregular bones include the vertebrae."},"mineral-catch":{name:"Bone builders",instruction:"CATCH THE MINERALS!",fact:"Bone hardness comes from mineral salts – mainly calcium phosphates.",learn:"Bone contains mineral salts (mainly calcium phosphate), organic matter (ossein – the protein collagen) and water. We get calcium and phosphorus from food (e.g. dairy, fish), and vitamin D helps absorb calcium."},remodel:{name:"Bone remodelling",instruction:"ACTIVATE THE OSTEOCLASTS!",fact:"Bone is constantly remodelled by osteoclasts and osteoblasts.",learn:"Osteoclasts (multinucleated bone-resorbing cells) break down bone tissue and release calcium. Osteoblasts (bone-forming cells) build new matrix and turn into osteocytes. Remodelling repairs micro-damage and adapts bone to loads."},"heal-fracture":{name:"Save the fracture",instruction:{primary:"GIVE FIRST AID!",highschool:"HEAL THE FRACTURE!",technical:"TREAT THE FRACTURE!"},fact:"For a fracture we immobilise the limb and call for help – we never set the bone.",learn:"First aid: call for help (112 / 999), immobilise the limb (for a fracture – two neighbouring joints), do not set the bone. Healing: haematoma → soft (fibrocartilaginous) callus → hard (bony) callus → remodelling. The periosteum plays a key role."},"posture-guard":{name:"Protect the spine",instruction:"PROTECT THE SPINE!",fact:"Good posture and exercise prevent posture defects.",learn:"Posture defects include scoliosis (sideways curve), excessive thoracic kyphosis (round back) and excessive lumbar lordosis (hollow back). Risk factors: sitting badly, lack of exercise, carrying loads on one side. Protection: physical activity, swimming, a backpack on both shoulders."},"calcium-run":{name:"Calcium delivery",instruction:"DELIVER CALCIUM TO THE BONE!",fact:"Calcium is absorbed in the intestine and carried to bones by the blood.",learn:"Calcium from food is absorbed in the small intestine – vitamin D helps (it is made in the skin under UV light and is also found in fish). Blood distributes calcium; in bone, osteoblasts build it into the matrix. Vitamin D deficiency in children causes rickets."},mineralize:{name:"Mineralisation",instruction:"MINERALISE THE BONE!",fact:"Mineral salts make bone hard; ossein makes it flexible.",learn:"Bone matrix consists of collagen fibres (ossein) with calcium phosphate crystals (hydroxyapatite) deposited on them. Together they make bone hard and at the same time resistant to breaking."},goniometer:{name:"Goniometer",instruction:"MEASURE THE JOINT ANGLE!",fact:"Range of motion in a joint is measured in degrees with a goniometer.",learn:"The elbow joint lets the forearm bend and straighten. A goniometer has two arms placed along the bones; the reading describes flexion. Range of motion = flexion − extension. Values in the game are for training only."},"xray-scan":{name:"X-ray scanner",instruction:"STOP THE X-RAY SCANNER!",fact:"The femur has a proximal epiphysis, a shaft and a distal epiphysis.",learn:"The proximal epiphysis is closer to the trunk (here: at the hip, with the femoral head); the distal epiphysis is further away (at the knee). An X-ray is the basic test when a fracture is suspected."},"bone-path":{name:"Bones in order",instruction:"PUT THE BONES IN ORDER!",fact:"A limb = a girdle + a free limb (from the trunk to the fingers).",learn:"Upper limb: shoulder girdle (clavicle, scapula) → humerus → forearm bones (radius, ulna) → carpals → metacarpals → phalanges. Lower limb: pelvic girdle → femur → lower leg bones (tibia, fibula) → tarsals → metatarsals → phalanges."},"match-function":{name:"Match the pairs",instruction:"MATCH THE PAIRS!",fact:"The structure of every part of the skeleton is linked to its function.",learn:"Structure matches function: smooth articular cartilage reduces friction, the periosteum nourishes bone and red marrow produces blood cells."},"odd-one-out":{name:"Odd one out",instruction:"WHICH ONE DOESN’T FIT?",fact:"Grouping terms helps organise knowledge about the skeleton.",learn:"Group the terms: bones of the upper and lower limb, bone shapes, parts of a joint, bone cells, types of bone connections."},"skeleton-labels":{name:"Label the skeleton",instruction:"LABEL THE SKELETON!",fact:"An adult skeleton has about 206 bones.",learn:"In front-view diagrams the right side of the body is on the left of the picture. In the forearm the radius is on the thumb side; in the lower leg the fibula is lateral (little-toe side)."},"true-false":{name:"True or false?",instruction:"TRUE OR FALSE?",fact:"Careful reading is half the battle!",learn:"Watch out for words like “always”, “never”, “only” – they often hide traps. The mandible is the only movable skull bone, but the girdles belong to the appendicular skeleton, not the axial one."},"joint-toggle":{name:"Movable or fixed?",instruction:"SET THE JOINT TYPES!",fact:"Bones are connected by fixed joints or movable (synovial) joints.",learn:"Fixed joints: fibrous (skull sutures), cartilaginous (pubic symphysis, intervertebral discs) and bony fusions (sacrum, hip bone). Movable joints are synovial joints – they have a capsule, a cavity with synovial fluid and cartilage-covered surfaces."},"quick-quiz":{name:"Quick choice",instruction:"QUICK CHOICE!",fact:"A quick decision – but a thoughtful one!",learn:"Questions come from the task bank – the teacher can edit them and add their own in the teacher panel."},"memory-bones":{name:"Remember the bones",instruction:"REMEMBER THE ORDER!",fact:"Bone shapes are easy to recognise: long, short, flat, irregular.",learn:"Bone tissue cells: osteoblasts (build), osteocytes (mature, in lacunae, with processes), osteoclasts (large, multinucleated – break down). Chondrocytes are cartilage cells."},"memory-patients":{name:"Emergency room",instruction:"REMEMBER THE PATIENTS!",fact:"A fracture is confirmed with an X-ray.",learn:"Commonly broken bones include the forearm bones (e.g. falling on an outstretched hand), the clavicle and the lower leg bones. In people with osteoporosis, hip (femoral neck) fractures are dangerous."},"vanishing-labels":{name:"Vanishing labels",instruction:"REMEMBER THE LABELS!",fact:"Every anatomical name points to a specific place.",learn:"Learn names together with location: proximal – closer to the trunk, distal – further away; the joint head fits the socket; the radius is on the thumb side."},"find-error":{name:"Find the mistake",instruction:"FIND THE MISTAKE IN THE DIAGRAM!",fact:"Every bone has a fixed place in the skeleton.",learn:"Spine from the top: cervical (7), thoracic (12), lumbar (5), sacrum, coccyx. Limbs – from the girdle to the phalanges."},"find-bone":{name:"Find the right one",instruction:"FIND THE RIGHT ONE!",fact:"The structure of bones and cells is linked to their function.",learn:"Long bone – shaft and ends; short – a small “cube”; flat – a plate; irregular – e.g. a vertebra. An osteocyte has many processes, an osteoclast is large and multinucleated, an osteoblast lies on the surface of growing bone."},"spot-change":{name:"What changed?",instruction:"WHAT HAS CHANGED?",fact:"Careful observation is the basis of an anatomist’s work.",learn:"Compare shapes: length, width, processes. In bone tissue slides look at the number of nuclei and the cell processes."},"sort-shape":{name:"Bone shapes",instruction:"SORT THE BONES!",fact:"Bones: long, short, flat and irregular.",learn:"Long: femur, humerus, tibia, phalanges. Short: carpals and tarsals. Flat: scapula, sternum, skull vault bones. Irregular: vertebrae, sphenoid."},"sort-axial":{name:"Axial or appendicular?",instruction:"AXIAL OR APPENDICULAR?",fact:"The shoulder and pelvic girdles belong to the appendicular skeleton.",learn:"Axial skeleton: skull, spine, rib cage. Appendicular skeleton: shoulder girdle (clavicles, scapulae) with the free upper limbs, and pelvic girdle (hip bones) with the free lower limbs."},"sort-chem":{name:"Minerals or ossein?",instruction:"SORT THE BONE COMPONENTS!",fact:"Mineral salts – hardness; ossein – flexibility.",learn:"Mineral salts (mainly calcium phosphate) make bone hard; they remain after heating and dissolve in acid. Ossein (collagen) makes bone flexible; it burns in a flame and remains after acid treatment."},"sort-joints":{name:"Bone connections",instruction:"FIXED OR MOVABLE?",fact:"Synovial joints are movable; skull sutures are fixed.",learn:"Fixed joints: fibrous, cartilaginous and bony fusions. Movable connections are synovial joints."},"sort-cells":{name:"Bone cells",instruction:"SORT THE CELL FEATURES!",fact:"Osteoblasts build, osteocytes maintain, osteoclasts break down bone.",learn:"Osteoblasts produce bone matrix. Osteocytes are mature cells in lacunae connected by processes. Osteoclasts – multinucleated – resorb bone."},"acid-fire":{name:"Fire or acid?",instruction:"HEATING OR ACID?",fact:"A heated bone is brittle; a bone decalcified in acid is bendy.",learn:"Experiment: heat a chicken bone in a flame – organic matter burns away, mineral salts remain and the bone crumbles. Soak another bone in vinegar or dilute hydrochloric acid for a few days – mineral salts dissolve, ossein remains and the bone can be bent."},"calc-bone":{name:"Bone composition maths",instruction:"CALCULATE THE BONE COMPOSITION!",fact:"Mineral salts make up most of the bone mass (data in tasks are simplified).",learn:"Percentage = part ÷ whole × 100%. After heating, the mass of mineral salts remains; the lost mass is organic matter and water. The data are for training only."},imaging:{name:"Imaging tests",instruction:"MATCH THE TESTS!",fact:"Bones are examined e.g. with X-ray, CT and densitometry.",learn:"X-ray – basic bone image; CT – cross-sectional images; MRI – shows ligaments and cartilage well; ultrasound – e.g. infant hips; densitometry (DXA) – bone mineral density. Results are interpreted by a doctor; the game does not diagnose."},"count-vertebrae":{name:"Count the vertebrae",instruction:"COUNT THE VERTEBRAE!",fact:"Spine: 7 cervical, 12 thoracic, 5 lumbar vertebrae.",learn:"12 pairs of ribs attach to the 12 thoracic vertebrae. The sacrum forms from 5 fused vertebrae and the coccyx from 3–5 rudimentary ones."},immobilize:{name:"Immobilise!",instruction:"WHAT SHOULD YOU IMMOBILISE?",fact:"Fracture – two neighbouring joints; dislocation – two neighbouring bones.",learn:"For a broken bone, immobilise the two neighbouring joints (e.g. broken forearm – elbow and wrist). For a dislocated or sprained joint – the two neighbouring bones. Do not try to set it; immobilise it in the position found and call for help."},"build-skeleton":{name:"Build the skeleton",instruction:"BUILD THE SKELETON!",fact:"Skeleton = axial skeleton + appendicular skeleton.",learn:"Axial skeleton: skull, spine and rib cage. Appendicular skeleton: girdles (shoulder and pelvic) and free limbs – upper and lower."},"bone-labels":{name:"Inside a bone",instruction:"LABEL THE BONE SECTION!",fact:"Long bone: epiphyses, shaft, periosteum, compact and spongy bone, medullary cavity.",learn:"The shaft is covered by periosteum; its wall is compact bone; inside is the medullary cavity (with yellow marrow in adults). The epiphyses contain spongy bone with red marrow, and joint surfaces are covered with articular cartilage. In children a growth plate between the epiphysis and the shaft lets the bone grow in length."},"joint-labels":{name:"Joint structure",instruction:"LABEL THE JOINT!",fact:"Joint: head, socket, articular cartilage, capsule, cavity with synovial fluid, ligaments.",learn:"The joint head fits into the socket. Joint surfaces are covered by smooth cartilage. The joint capsule surrounds the joint; its synovial membrane produces the fluid filling the joint cavity. Ligaments strengthen the joint."},"fix-labels":{name:"Fix the labels",instruction:"FIX THE MIXED-UP LABELS!",fact:"A diagram’s labels must match the picture.",learn:"Check the location: does the label point t
